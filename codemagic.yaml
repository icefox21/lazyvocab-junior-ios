workflows:
  build-unsigned-ios:
    name: Build LazyVocab Junior iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build unsigned iOS app (Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package real Mach-O Payload to IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r ../LazyVocab-Junior-iOS.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/LazyVocab-Junior-iOS.ipa
