name: vocab_player
description: A clean, automated vocabulary player for kids with Ebbinghaus scheduling.
publish_to: 'none'
version: 0.1.0-alpha+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  webview_flutter_wkwebview: ^3.13.0
  path_provider: ^2.1.5
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/splash.png
    - assets/www/
    - assets/www/audio_cache/
